/* ==================== HELPERS ==================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = s => encodeURIComponent(s);
const classLabel = id => (CLASSES.find(c => c.id === id) || {}).label || id;
const sectionLabel = (cls, subj, id) => (sectionsFor(cls, subj).find(s => s.id === id) || {}).label || id;
const newestFirst = list => [...list].sort((a, b) => b.date.localeCompare(a.date));

function crumb(parts) {
  return `<div class="crumb">${parts.map(p => p.href ? `<a href="${p.href}">${esc(p.label)}</a>` : esc(p.label)).join(" / ")}</div>`;
}

function docCard(d) {
  const shareText = `${d.title} - Free download on PakStudyfy: ${SITE_URL}`;
  const waLink = `https://wa.me/?text=${enc(shareText)}`;
  const dl = d.url === "#"
    ? `<span class="btn btn-soon">Coming soon</span>`
    : `<a class="btn btn-download" href="${esc(d.url)}" target="_blank" rel="noopener">&#11015; Download</a>`;
  return `
    <div class="card doc">
      <div class="doc-info">
        <div class="doc-title">${esc(d.title)}</div>
        <div class="doc-meta">${esc(classLabel(d.cls))} &bull; ${esc(d.subject)} &bull; ${esc(sectionLabel(d.cls, d.subject, d.section))} &bull; ${esc(d.date)}</div>
      </div>
      <div class="actions">
        ${dl}
        <a class="btn btn-wa" href="${waLink}" target="_blank" rel="noopener">WhatsApp Share</a>
      </div>
    </div>`;
}

function docList(items, emptyText = "No files uploaded yet. Check back soon!") {
  return items.length ? items.map(docCard).join("") : `<div class="empty">${emptyText}</div>`;
}

function onSearch(e) {
  e.preventDefault();
  const q = e.target.q.value.trim();
  if (q) location.hash = "search/" + enc(q);
}

      ${CLASSES.map(c => `<a class="tile" href="#class/${c.id}">${esc(c.label)}</a>`).join("")}
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <a class="tile tile-solid" href="#notices">Notice Board<small>Educational news &amp; updates</small></a>
      <a class="tile tile-solid" href="#skills">Skills &amp; Learn and Earn<small>Courses to learn &amp; earn online</small></a>
    </div>

    <h2>Latest Uploads</h2>
    ${docList(newestFirst(DOCS).slice(0, 10))}`;
}

function viewClass(cls) {
  return `
    ${crumb([{label:"Home", href:"#home"}, {label:classLabel(cls)}])}
    <h1>${esc(classLabel(cls))}</h1>

    <h2>Choose a Subject</h2>
    <div class="grid">
      ${SUBJECTS[cls].map(s => `<a class="tile" href="#class/${cls}/${enc(s)}">${esc(s)}</a>`).join("")}
    </div>

    <h2>Class Resources</h2>
    <div class="grid">
      ${GENERAL_SECTIONS.map(s => `<a class="tile" href="#class/${cls}/General/${s.id}">${esc(s.label)}<small>${esc(s.desc)}</small></a>`).join("")}
    </div>`;
}

function viewSubject(cls, subj) {
  return `
    ${crumb([{label:"Home", href:"#home"}, {label:classLabel(cls), href:`#class/${cls}`}, {label:subj}])}
    <h1>${esc(classLabel(cls))} - ${esc(subj)}</h1>
    <h2>Choose a Section</h2>
    <div class="grid">
      ${sectionsFor(cls, subj).map(s => `
        <a class="tile tile-solid" href="#class/${cls}/${enc(subj)}/${s.id}">
          ${esc(s.label)}
          <small>${esc(s.desc)}</small>
        </a>`).join("")}
    </div>`;
}

function viewSection(cls, subj, sec) {
  const s = sectionsFor(cls, subj).find(x => x.id === sec);
  const items = newestFirst(DOCS.filter(d => d.cls === cls && d.subject === subj && d.section === sec));
  const parent = subj === "General" ? {label:"Class Resources"} : {label:subj, href:`#class/${cls}/${enc(subj)}`};
  return `
    ${crumb([{label:"Home", href:"#home"}, {label:classLabel(cls), href:`#class/${cls}`}, parent, {label:s.label}])}
    <h1>${esc(classLabel(cls))} - ${esc(subj === "General" ? "" : subj + " - ")}${esc(s.label)}</h1>
    <p style="color:var(--muted);margin:6px 0 16px">${esc(s.desc)}</p>
    ${docList(items, `No ${esc(s.label)} uploaded yet for ${esc(classLabel(cls))}${subj === "General" ? "" : " " + esc(subj)}. Check back soon!`)}`;
}

function viewSearch(q) {
  const term = q.toLowerCase();
  const items = newestFirst(DOCS.filter(d =>
    [d.title, d.subject, classLabel(d.cls), d.section].join(" ").toLowerCase().includes(term)
  ));
  return `
    ${crumb([{label:"Home", href:"#home"}, {label:"Search"}])}
    <h1>Results for "${esc(q)}"</h1>
    ${docList(items, "No results found. Try another keyword like Math or 10th.")}`;
}

function viewNotices() {
  return `
    ${crumb([{label:"Home", href:"#home"}, {label:"Notice Board"}])}
    <h1>Notice Board</h1>
    <p style="color:var(--muted);margin:6px 0 16px">Educational news and updates</p>
    ${newestFirst(NOTICES).map(n => `
      <div class="card notice">
        <div class="doc-title">${esc(n.title)}</div>
        <div class="doc-meta">${esc(n.date)}</div>
        <p style="margin-top:8px">${esc(n.text)}</p>
      </div>`).join("") || `<div class="empty">No notices yet.</div>`}`;
}

function viewSkills() {
  const cats = [...new Set(COURSES.map(c => c.cat))];
  return `
    ${crumb([{label:"Home", href:"#home"}, {label:"Skills & Learn and Earn"}])}
    <h1>Skills &amp; Learn and Earn</h1>
    <p style="color:var(--muted);margin:6px 0 10px">Learn a skill, then start earning with it.</p>
    <input class="search-box" id="skillQ" placeholder="Search courses (e.g. Fiverr, Python, Canva)..." oninput="renderSkillList()">
    <div id="skillList"></div>`;
}

function renderSkillList() {
  const q = ($("#skillQ") ? $("#skillQ").value : "").trim().toLowerCase();
  const list = COURSES.filter(c => (c.title + " " + c.cat).toLowerCase().includes(q));
  const cats = [...new Set(list.map(c => c.cat))];
  $("#skillList").innerHTML = cats.length ? cats.map(cat => `
      <h2>${esc(cat)}</h2>
      ${list.filter(c => c.cat === cat).map(c => `
        <div class="card doc">
          <div class="doc-info">
            <span class="course-cat">${esc(c.cat)}</span>
            <div class="doc-title">${esc(c.title)}</div>
          </div>
          <div class="actions">
            <a class="btn btn-download" href="${esc(c.link)}" target="_blank" rel="noopener">Open Course</a>
            <a class="btn btn-wa" href="https://wa.me/?text=${enc(c.title + " - Free course on PakStudyfy: " + SITE_URL)}" target="_blank" rel="noopener">WhatsApp Share</a>
          </div>
        </div>`).join("")}`).join("")
    : `<div class="empty">No courses found. Try another keyword.</div>`;
}

function viewNotFound() {
  return `<div class="empty">Page not found. <a href="#home">Go to Home</a></div>`;
}

/* ==================== ROUTER ==================== */
function render() {
  const parts = (location.hash.slice(1) || "home").split("/").map(p => { try { return decodeURIComponent(p); } catch(e) { return p; } });
  const [page, a, b, c] = parts;
  let html;

  if (page === "home" || !page)   html = viewHome();
  else if (page === "class") {
    if (!CLASSES.find(x => x.id === a)) html = viewNotFound();
    else if (!b) html = viewClass(a);
    else if (!c) html = (b === "General" || SUBJECTS[a].includes(b)) ? viewSubject(a, b) : viewNotFound();
    else html = viewSection(a, b, c);
  }
  else if (page === "search")     html = viewSearch(a || "");
  else if (page === "notices")    html = viewNotices();
  else if (page === "skills")     html = viewSkills();
  else if (PAGES[page])           html = `<div class="page"><h1>${PAGES[page].title}</h1>${PAGES[page].body}</div>`;
  else                            html = viewNotFound();

  $("#app").innerHTML = html;
  if (page === "skills") renderSkillList();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", render);
$("#year").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
